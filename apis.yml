name: Vima Therapeutics
description: Vima Therapeutics is a clinical-stage biotechnology company developing novel oral therapies
  for movement disorders, with a focus on the underlying biology of dystonia and Parkinson's disease.
  Its lead program is an experimental oral therapy being evaluated in the Stride dystonia clinical study,
  aimed at helping patients regain control of movement rather than only managing symptoms. The company
  targets dystonia, dystonic cerebral palsy, and Parkinson's disease — conditions that collectively affect
  more than one million people in the United States. Vima was surfaced in the API Evangelist network as a
  portfolio company of Canaan Partners. As a patient- and clinician-facing therapeutics company, it
  publishes no public developer program, API, SDK, or technical documentation surface at this time.
